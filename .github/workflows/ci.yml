name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Requirements (the tests' own; krew itself runs in Hermes's environment)
        run: python -m pip install pytest PyYAML numpy Pillow
      - name: Tests, the scrub included (tests/test_scrub.py)
        run: python -m pytest tests -q
