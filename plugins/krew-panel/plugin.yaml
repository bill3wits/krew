name: krew-panel
version: 1.0.0
description: >
  The Control Panel as tools. Everything the human reads at the Control Panel —
  unit lamps, journals, unit scripts, log lanes, security, health battery —
  plus the safe actuators (camera home, kiosk, announcer mute). Same HTTP
  routes the panel's own JS calls, so this adds no authority the glass did
  not already have. Settings: `panel:` in $KREW_HOME/krew.yaml (url, camera_url,
  announce_mute); unset, every tool says so and sends nothing. Not here on purpose: unit restart, the Voice master,
  who_is_here (Inspector lease), and occupancy (that is the machine's GPU-mode tool).
author: krew
entry: __init__.py
kind: standalone
requires_env: []
provides:
  - toolset: team
    tools: [panel_units, panel_journal, panel_script, panel_log,
            panel_security, panel_health, panel_camera_home,
            panel_kiosk, panel_announcer]
requires_hermes: ">=0.21.4"
