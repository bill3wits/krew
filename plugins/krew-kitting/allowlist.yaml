# Crew skill allowlist — SoT for which SKILL.md names may enter the index.
#
#
#
# The krew-kitting plugin computes skills.disabled = (on disk) − (this ∪ house).
#
# KREW SKILLS ARE NOT LISTED HERE. Anything in hermes-packs/skills/ or under
# a profile's skills/house/ is allowed on the profile that has it. That is how
# zoey-auth / zoey-big-push / krew-render / scout-* / steward-logs survive every
# hermes update without being re-added to a denylist.
#
#
# not skills. This file does not disable them. toolsets stay in each
# distribution config.yaml / crew.manifest.yaml.
#
# New Nous bundled SKILL.md names default OFF until someone adds them here.

schema: krew_kitting_allowlist/v1

