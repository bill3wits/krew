name: krew-docs
version: 1.0.0
description: >
  The docs database for your agents: one tool, krew_docs (lookup, read, suggest), toolset `docs`, over a
  local hybrid (BM25 + optional CPU embeddings) index of the folders you name. Suggestions go to a review
  queue you approve. Settings: `docs:` in $KREW_HOME/krew.yaml. Build the index first (README).
author: krew
entry: __init__.py
kind: standalone
requires_hermes: ">=0.21.4"
requires_env: []
provides:
  - toolset: docs
    tools: [krew_docs]
