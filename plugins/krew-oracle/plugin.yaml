name: krew-oracle
version: 1.0.0
description: >
  The Oracle visit loop's tools for the front door: presence read, inspector look, AUTH chase, look at a
  station, name a face, embed a frame, the operator recount. HTTP only, to the Crissa Wall's player
  (ZOEYOS_PLAYER, /v1/rail/presence) and, for the camera verbs, the presence service's own address
  (oracle.presence_url in $KREW_HOME/krew.yaml). Does not grant AUTH. Guests are not occupancy.
author: krew
entry: __init__.py
kind: standalone
requires_hermes: ">=0.21.4"
requires_env: []
provides:
  - toolset: team
    tools: [oracle_visit, oracle_presence, oracle_chase_auth, oracle_inspect, oracle_embed, oracle_look_at, oracle_name_face, error-check]
