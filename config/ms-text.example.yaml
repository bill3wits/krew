  card.canary_skip.block_reason: '{env} canary skipped {n} nights in a row - the owner decides'
  card.footer: 'Protocol: files/packs/units → Parallax T0 → Vera prodgate → apply. Venv → host uv + smoke (nightly or Steward M&S land child), not prodgate. A land card is a ROOT card — never `--parent`/`parents` under THIS card: a link makes the NEW card wait on this one, and this one is not done (t_cc6c958c 2026-09-18: 5 runs, 5 blocks, the land card never dispatched). To wait for it: `kanban_link(parent_id=<land>, child_id=<this>)` then a `dependency` block; hermes promotes this card when the land is done. needs-crissa last resort (physical, or stuck after Ada + worker + Vera). the owner does not. Already decided → do not bother him. NEEDS HUMAN is physical only.'
  card.land.body: 'M&S land child for `{env}`. Assignee steward.

    Parent {parent} already GO. Nightly uv+smoke/canary/rollback. Not prodgate. Not the owner. Completing this card completes the parent.

    ## Actionable packages

    {arrows}

    '
  card.land.complete: '{env}: M&S land {n} upgraded; smoke/canary ok. Not the owner. Not prodgate.'
  card.mitigation.criteria: "## ACTIONABLE ONLY — completion criteria\n1. **BEFORE research:** read `docs/DEPS-PINNED-FINDINGS.md` and `{decisions}`. Cite existing holds; do not re-changelog them.\n2. **Deliverable (required):** write ONE markdown file under `{deliverables}/` named `{name}-dep-mitigation-{day}.md` (or update that file).\n3. **Out of kanban — land without the owner:**\n   **GREEN:** nightly 22:33 `uv --no-deps` + smoke/canary. Ledger `pending_apply` on a green target is the deferral queue.\n   **MAJOR (specialist GO):** do NOT complete this parent. File the land card as a ROOT card:\n     `hermes kanban create 'M&S land: {name}' --assignee steward` (NO `--parent`: a `--parent $HERMES_KANBAN_TASK` link makes the land card wait on THIS card, which is not done, so it never dispatches — t_cc6c958c self-deadlocked 2026-09-18). Then `kanban_link(parent_id=<land id>, child_id=$HERMES_KANBAN_TASK)` and end this run with a `dependency` block: hermes promotes this card when the land is done and the next run verifies the scan.\n   Steward's next M&S (22:33) lands the child (uv+smoke). If you forget, nightly schedules the child when this card is done GO. NOT prodgate. NOT the owner.\n   **FILES / packs / units:** prodgate → Vera → apply. Page Crissa if stuck.\n   `hold`/`wontfix` only if it must never land.\n4. **Comments are status only.** Ada: refuse complete if there is no ledger row and no smoke. the owner does not close dep cards.\n5. **Do NOT** decompose into per-package children. Do NOT edit freeze manifests.\n6. NEVER_AUTO (torch/vllm/transformers/…) stay off this path. NEEDS HUMAN is physical world only."
  card.render_sota.footer: 'T0: prodgate → Vera → apply. Stuck → bash/steward, not Crissa. the owner does not.'
  card.render_sota.path: '## Path (no owner)

    1. Ada assigns **bash** (or steward). Orderly swap: `ref-mode render turbo` (ops park + Comfy start are inside Render mode). Do not `systemctl stop` brains to make a window.

    2. Smoke, look at the files, restore with `ref-mode normal`: `flux2-turbo` still, `ltx23-flf2v` first+last hub, `ltx25-flf2v` first+last hub. Prompt glance at the **user/camera**, not the lid. **No inventory row.**

    3. Vera prodgate. Checkout the origin tag in `{data}/comfy` (keep `workflows/` + `start-comfyui.sh`). Isolated venv `${MS_ENVS_ROOT}/comfyui` only — never `${MS_ENVS_ROOT}/vllm`. Skip unpinned torch.

    4. If ComfyUI-LTXVideo import fails (RoPE / kornia.pad), bump that plugin as a second step. Leave with `ref-mode normal`.

    5. Crystal: this trail''s render block + smoke paths under `{data}/comfy/output/`. Ledger `applied` or `hold`.'
