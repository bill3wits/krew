# M&S settings: copy to $KREW_HOME/ms.yaml (default ~/.krew/ms.yaml; MS_SETTINGS overrides the path).
# Nothing in this file is needed: with no ms.yaml, M&S starts empty and uses discovery (krew-ms.py) to find this
# machine's units, endpoints, Python envs, GPUs, models and Hermes profiles. Machine specifics go here, never in code.

upgrades: false          # true allows package upgrades, the vLLM canary, rollbacks and unit restarts (--apply-green ...)
# state_dir: ~/.krew/ms   # reports, manifests and the decisions ledger (decisions.json)
# env_roots: []           # folders whose subfolders are Python envs (each <env>/bin/python or <env>/.venv/bin/python)

discovery:               # krew-ms.py, read-only; every key optional
  units:
    prefixes: [hermes-, krew-]      # systemd units named like this are yours
    exec_markers: []                # [] = your home, $KREW_HOME and $HERMES_HOME: a unit whose ExecStart points there is yours
  env_roots: [~/.venvs, ~/venvs, ~/envs]
  ports:
    owners: self                    # probe listening sockets owned by you; `all` probes every local listener
    probe_timeout_s: 0.8
  model_dirs: []                    # extra Hugging Face style caches (models--org--name); HF_HOME / ~/.cache/huggingface are read anyway
  note_days: 7                      # how long a new / removed note stays on the map
# render:
#   env: ''                         # the env that holds your render tool (the reference install: comfyui); a hold on it pauses render cards

