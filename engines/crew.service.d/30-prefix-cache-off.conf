[Service]
# Prefix caching OFF on crew (the User, 2026-09-09: "I'd want a durable fix").
# Qwen3.8-27B is a hybrid GDN model; vLLM 0.27.1 runs its mamba cache in
# 'align' mode to allow prefix caching and boots with "support for Mamba
# layers is experimental". 2026-09-09 10:22 two identical Ada kanban
# workers prefilled at the same instant and the cached blocks for that
# ~17k-token prefix came out wrong: every later Ada worker decoded token
# salad from token 1 while every other prompt on the same engine was
# sane (short, 45k, 1-char perturbation, temp 0). reset_prefix_cache at
# idle cured it; a recompute made concurrently can re-poison. Ada's
# normal dispatch (3 identical prefixes at once) is exactly that shape.
# Cost, measured 2026-09-09 on Ada's real 17k-token worker request:
# prefix on = 2.05 s cold / 0.50 s cached TTFT; prefix off = 2.0 s every call
# (bench in docs/sessions/2026-09/WRAP-20260909-CREW-PREFIX-CACHE.md).
# Zoey is on ops, not crew.
# Rollback: delete this file, daemon-reload, restart crew
# (start-crew.sh default CREW_PREFIX_CACHE=1).
Environment=CREW_PREFIX_CACHE=0
